# Quenga Designs site CI. One self-contained file per site repo: no secrets, no outside repos, free runner minutes only.
# Thresholds come from Argus (qa/STANDARDS.md); a repo can override them in .github/site-ci.json {"perf":0.90,"a11y":0.95}.
# Runs on preview and main only (dev is skipped on purpose to save the free minutes), plus a manual run.
name: site-ci
on:
  push:
    branches: [preview, main]
  workflow_dispatch:
concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: "1"
  # placeholders only (not secrets): lets Supabase-backed sites build; pages that need live data show their empty state
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: install temp dir
        run: echo "CI_TMP=$RUNNER_TEMP/siteci" >> "$GITHUB_ENV"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: secrets (gitleaks, redacted)
        run: |
          set -euo pipefail
          mkdir -p "$CI_TMP/bin" && cd "$CI_TMP/bin"
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$CI_TMP/bin/gitleaks" dir . --redact --no-banner

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: install and build
        run: |
          set -euo pipefail
          corepack enable
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; B="pnpm"; else npm ci; B="npm run"; fi
          $B build

      - name: serve and crawl (every same-site page, saved as HTML)
        run: |
          set -euo pipefail
          mkdir -p "$CI_TMP/site"
          (npx --no-install next start -p 3123 > "$CI_TMP/server.log" 2>&1 &)
          for i in $(seq 1 40); do curl -sf -o /dev/null http://localhost:3123/ && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3123/ || { echo "server did not start"; tail -20 "$CI_TMP/server.log"; exit 1; }
          python3 - <<'PY'
          import os, re, sys, urllib.request, urllib.parse
          base = "http://localhost:3123"; out = os.environ["CI_TMP"] + "/site"
          seen, queue, bad = set(), ["/"], []
          while queue and len(seen) < 40:
              p = queue.pop(0)
              if p in seen: continue
              seen.add(p)
              try:
                  r = urllib.request.urlopen(base + p, timeout=20); html = r.read().decode("utf-8", "replace")
              except Exception as e:
                  bad.append((p, str(e)[:60])); continue
              d = os.path.join(out, p.strip("/")); os.makedirs(d, exist_ok=True)
              # strip cache-busting query strings from local asset links so lychee can resolve the files
              html_saved = re.sub(r'((?:href|src)=")(/[^"?]+)\?[^"]*"', r'\1\2"', html)
              open(os.path.join(d, "index.html"), "w").write(html_saved)
              for h in re.findall(r'href="([^"#?]+)', html):
                  if h.startswith("/") and not h.startswith("//") and not re.search(r'\.(png|jpe?g|webp|svg|ico|pdf|xml|txt|css|js|woff2?)$', h):
                      queue.append(h.rstrip("/") or "/")
          # anything else a page points at on this site (generated icons, OG images) is fetched from the running server
          missing = set()
          for f in os.popen("find " + out + " -name index.html").read().split():
              for h in re.findall(r'(?:href|src)="(/[^"?#]+)', open(f).read()):
                  if not os.path.exists(out + h) and not os.path.isdir(out + h) and h.rsplit("/", 1)[-1].count("."): missing.add(h)
          for h in sorted(missing)[:60]:
              try:
                  data = urllib.request.urlopen(base + h, timeout=20).read()
                  os.makedirs(os.path.dirname(out + h), exist_ok=True); open(out + h, "wb").write(data)
              except Exception: pass  # genuinely missing: lychee reports it next
          open(out + "/_routes.txt", "w").write("\n".join(sorted(seen)))
          print("crawled", len(seen), "pages;", len(bad), "unreachable")
          # static assets the pages point at (public files, built chunks) so internal asset links can be verified
          import shutil
          if os.path.isdir("public"): shutil.copytree("public", out, dirs_exist_ok=True)
          if os.path.isdir(".next/static"): shutil.copytree(".next/static", out + "/_next/static", dirs_exist_ok=True)
          for p, e in bad: print("UNREACHABLE", p, e)
          sys.exit(1 if bad else 0)
          PY

      - name: internal links (lychee, offline)
        run: |
          set -euo pipefail
          cd "$CI_TMP/bin"
          curl -sSLO https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  lychee-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar xzf lychee-x86_64-unknown-linux-gnu.tar.gz
          # external links are NOT fetched here: social sites answer 403/429. Argus checks those by hand.
          LY=$(find "$CI_TMP/bin" -name lychee -type f | head -1)
          # pages and assets must resolve (blocking); #anchors are a warning only, because some anchors are created by scripts after load
          "$LY" --offline --no-progress --fallback-extensions html --exclude "/_next/image" --root-dir "$CI_TMP/site" "$CI_TMP/site"
          "$LY" --offline --no-progress --include-fragments --fallback-extensions html --exclude "/_next/image" --root-dir "$CI_TMP/site" "$CI_TMP/site" || echo "::warning::some #anchors were not found in the served HTML (check by hand)"

      - name: copy rules (no-list, em dashes, attribution, names)
        run: |
          python3 - <<'PY'
          import os, re, sys, glob, html as H
          root = os.environ["CI_TMP"] + "/site"
          NOLIST = ["elevate", "elevated", "nestled", "unparalleled", "seamless", "seamlessly", "journey", "unlock", "look no further",
                    "a testament to", "we're passionate about", "we are passionate about", "tailored", "curated", "delve", "game-changer",
                    "world-class", "cutting-edge", "state-of-the-art", "crafted with care", "elevating"]
          ATTRIB = ["claude", "anthropic", "ai-generated", "generated by ai", "made with ai", "built with ai", "co-authored-by", "chatgpt", "openai"]
          # words a repo may keep on purpose, one per line in .github/copy-allow.txt (for example a word inside a verbatim customer review)
          if os.path.exists(".github/copy-allow.txt"):
              allow = {l.split("#")[0].strip().lower() for l in open(".github/copy-allow.txt") if l.split("#")[0].strip()}
              NOLIST = [w for w in NOLIST if w not in allow]
          fails = []
          deny = []
          if os.path.exists(".github/deny-names.txt"):
              deny = [l.strip().lower() for l in open(".github/deny-names.txt") if l.strip() and not l.startswith("#")]
          for f in glob.glob(root + "/**/index.html", recursive=True):
              raw = open(f, encoding="utf-8").read()
              page = "/" + os.path.relpath(os.path.dirname(f), root).replace(".", "")
              body = re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", raw)
              alts = " ".join(re.findall(r'(?i)\b(?:alt|title|aria-label|content)="([^"]*)"', body))
              text = H.unescape(re.sub(r"<[^>]+>", " ", body)) + " " + H.unescape(alts)
              low = text.lower()
              for w in NOLIST:
                  if re.search(r"(?<![a-z])" + re.escape(w) + r"(?![a-z])", low): fails.append((page, "no-list word", w))
              if "—" in text: fails.append((page, "em dash in copy", "U+2014"))
              for w in ATTRIB:
                  if w in low: fails.append((page, "AI attribution", w))
              # "TODO" only in capitals: Spanish "todo" is a normal word on the bilingual demos
              for m in re.findall(r"(?i)\b(lorem ipsum|your business|example\.com)\b|\bTODO\b", text): fails.append((page, "placeholder", "placeholder text"))
              for n in deny:
                  if n in low: fails.append((page, "name on the deny list", "line in .github/deny-names.txt"))
          # report page + rule + the matched word only, never the surrounding copy
          for p, rule, w in sorted(set(fails)): print("FAIL", p, "|", rule, "|", w)
          print("copy rules:", "FAIL" if fails else "PASS")
          sys.exit(1 if fails else 0)
          PY

      - name: Lighthouse mobile (performance and accessibility gates)
        run: |
          set -euo pipefail
          PERF=0.90; A11Y=0.95
          if [ -f .github/site-ci.json ]; then
            PERF=$(python3 -c "import json;print(json.load(open('.github/site-ci.json')).get('perf',0.90))")
            A11Y=$(python3 -c "import json;print(json.load(open('.github/site-ci.json')).get('a11y',0.95))")
          fi
          # lhci's default is the mobile preset (phone emulation, slow 4G). 2 runs per page, median counts.
          python3 - "$PERF" "$A11Y" <<'PY'
          import json, os, sys
          routes = [l for l in open(os.environ["CI_TMP"] + "/site/_routes.txt").read().split() if l][:5]
          cfg = {"ci": {
            "collect": {"url": ["http://localhost:3123" + r for r in routes], "numberOfRuns": 2,
                        "settings": {"chromeFlags": "--no-sandbox --headless=new", "onlyCategories": ["performance", "accessibility"]}},
            "assert": {"assertions": {
              "categories:performance": ["error", {"minScore": float(sys.argv[1]), "aggregationMethod": "optimistic"}],
              "categories:accessibility": ["error", {"minScore": float(sys.argv[2]), "aggregationMethod": "median"}]}}}}
          json.dump(cfg, open(os.environ["CI_TMP"] + "/lighthouserc.json", "w"))
          PY
          cd "$GITHUB_WORKSPACE"
          npx --yes @lhci/cli@0.15.1 autorun --config="$CI_TMP/lighthouserc.json"
